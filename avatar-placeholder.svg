<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.2)" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.18)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="160" r="140" fill="url(#glow)" />

  <!-- Outer Card / Hexagonal Circle Base -->
  <rect x="16" y="16" width="288" height="288" rx="40" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />
  
  <!-- Subtle Grid Texture -->
  <rect x="18" y="18" width="284" height="284" rx="38" fill="url(#grid)" />

  <!-- Technical Circuit / Corner Accents -->
  <path d="M 36 60 L 36 36 L 60 36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 284 60 L 284 36 L 260 36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 36 260 L 36 284 L 60 284" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 284 260 L 284 284 L 260 284" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Inner Tech Circle -->
  <circle cx="160" cy="140" r="76" fill="#0b1120" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Developer Silhouette / Monogram -->
  <!-- Stylized Shield & Terminal Elements -->
  <path d="M 160 84 L 210 102 C 210 142 160 178 160 178 C 160 178 110 142 110 102 Z" fill="rgba(14, 165, 233, 0.08)" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Monogram "SS" -->
  <text x="160" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#accent-grad)" text-anchor="middle" letter-spacing="2">SS</text>
  
  <!-- Terminal Prompt Accent -->
  <text x="160" y="162" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">&lt;subhojit.dev /&gt;</text>

  <!-- Status Bar / Badge at Bottom -->
  <rect x="52" y="238" width="216" height="34" rx="17" fill="#0a0f1d" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
  <circle cx="72" cy="255" r="4.5" fill="#10b981" />
  <text x="86" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">BCA Student • Cyber &amp; AI/ML</text>
</svg>
